# Quality pipeline: Conventional Commits and SAST (Semgrep with the Aedis rules) through the Aedis Platform reusables,
# plus the REUSE lint. The chart, image and baseline realm jobs (lint, Trivy, install in kind, DAST, FAPI 2.0
# conformance) land with the code they check; see docs/design.md. The gate (gate.yml) listens for the end of this
# workflow on pull requests.
name: aedis-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "23 5 * * *"

# One run per pull request: a new push or closing the PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@4d715640b144e85e962c5cb6e0ab77631f4f8464 # v4.1.1
    permissions:
      contents: read

  sast:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@4d715640b144e85e962c5cb6e0ab77631f4f8464 # v4.1.1
    permissions:
      contents: read
      security-events: write

  reuse:
    if: github.event.action != 'closed'
    name: REUSE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==5.0.2 lint
